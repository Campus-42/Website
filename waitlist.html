  <section id="contact-form" class="waitlist-form">
    <div class="btn-text-center">
      <img src="/images/light-logo.jpeg" style="border-radius: 10px; width: 5em; padding-bottom: 50px; ">
    </div>
    <h2 class="heading-3">Waitlist Form</h2>
    <div class="container-2 w-container">
      <!-- <p class="paragraph-3">For any queries regarding our services, please don&#x27;t hesitate to contact us. We will do our best to get back to you as soon as possible!</p> -->
      <!-- <div id="formInstructions" class="small-text"><em>Fields marked with an asterisk (*) are required.</em></div> -->
      <div class="w-form">
        <form id="contactForm" action="POST">
          <div class="contact-form-grid">
            <div><label for="Name" id="contact-first-name" class="field-label">Name</label><input type="text" class="text-field w-input" maxlength="256" name="name" data-name="name" placeholder="Enter your name" id="name" required=""></div>
            <div><label for="Contact-studentID-Number" id="contact-studentID">Student ID</label><input type="number" class="text-field-4 w-input" min="7" max="7" name="studentID" data-name="studentID" placeholder="Enter your studentID" id="studentID" required=""></div>
          </div>
          <div class="btn-text-center">
            <input type="submit" value="submit" name="submit" data-wait="Please wait..." class="pill secordary-button w-button" id="submit" onclick="submitted()">
          </div>
          <style>
            .btn-text-center {
              text-align: center;	
            }
          </style>
        </form>
        <div class="success-message w-form-done">
          <div>Thank you! Your submission has been received!</div>
        </div>
        <div class="w-form-fail">
          <div>Oops! Something went wrong while submitting the form.</div>
        </div>
      </div>
    </div>
  </section>
